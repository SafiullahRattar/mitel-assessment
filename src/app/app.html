<header class="topbar">
  <div class="inner-topbar">
    <span class="title-topbar"> Admin Panel </span>
  </div>
</header>

<main>
  <div class="page-header">
    <h1>Users</h1>

    @if (srvc.users().length) {
      <p>{{ srvc.users().length }} users</p>
    }
  </div>

  @if (srvc.loading()) {
    <p class="state">Loading users...</p>
  } @else if (srvc.error()) {
    <div class="state">
      <p>Users couldn't be loaded</p>
      <button type="button" class="link" (click)="srvc.reload()">Reload Users</button>
    </div>
  } @else {
    <app-user-table [users]="srvc.users()" [selected]="selected()" (userSelected)="selected.set($event)"/>
  }
</main>

<app-user-drawer [user]="selected()" (closed)="selected.set(null)"/>
